name: Backend

on:
  workflow_call:
    inputs:
      configuration:
        description: Konfiguracja buildu (Debug lub Release)
        type: string
        required: false
        default: Release
      publish_reports:
        description: Czy publikować raport testów jako artefakt
        type: boolean
        required: false
        default: true
      report_retention_days:
        description: Liczba dni przechowywania raportu (1-90)
        type: number
        required: false
        default: 7
    outputs:
      report_name:
        description: Nazwa artefaktu z raportem backendu
        value: ${{ jobs.backend.outputs.report_name }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    env:
      LAB_LABEL: ${{ vars.LAB_LABEL }}

    outputs:
      report_name: ${{ steps.backend-check.outputs.report_name }}

    steps:
      - name: Validate inputs
        shell: bash
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          RETENTION_DAYS: ${{ inputs.report_retention_days }}
        run: |
          case "$CONFIGURATION" in
            Debug|Release) ;;
            *)
              printf '::error title=backend::Nieprawidłowa konfiguracja. Dozwolone wartości: Debug, Release.\n'
              exit 1
              ;;
          esac

          if ! [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || (( RETENTION_DAYS > 90 )); then
            printf '::error title=backend::Nieprawidłowa retencja raportu. Dozwolona liczba całkowita od 1 do 90.\n'
            exit 1
          fi

          printf 'Configuration: %s\n' "$CONFIGURATION"
          printf 'Report retention days: %s\n' "$RETENTION_DAYS"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pokaż etykietę projektu
        run: |
          echo "Uruchamiam CI dla projektu: $LAB_LABEL"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ci-nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-${{ hashFiles('backend/packages.lock.json', 'backend.tests/packages.lock.json') }}
          restore-keys: |
            ci-nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-

      - name: Sprawdź wynik cache NuGet
        run: |
          if [ "${{ steps.nuget-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Dokładne trafienie cache NuGet"
          else
            echo "Brak dokładnego trafienia cache NuGet; sprawdź log przywracania"
          fi

      - name: Check Docker
        run: docker version

      - name: Backend check
        id: backend-check
        uses: ./.github/actions/backend-check
        with:
          configuration: ${{ inputs.configuration }}

      - name: Read report metadata
        if: ${{ always() }}
        env:
          REPORT_NAME: ${{ steps.backend-check.outputs.report_name }}
        shell: bash
        run: |
          printf 'Report: %s\n' "$REPORT_NAME"
          printf 'Component: %s\n' "$REPORT_COMPONENT"

      - name: Zachowaj raporty backendu
        if: ${{ always() && inputs.publish_reports }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backend-check.outputs.report_name }}
          path: TestResults/backend.trx
          retention-days: ${{ inputs.report_retention_days }}
          if-no-files-found: warn

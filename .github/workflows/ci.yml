name: Mission Control CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify lockfiles
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json

      - name: Check Docker
        run: docker version

      - name: Restore dependencies
        run: dotnet restore MissionControl.slnx --locked-mode

      - name: Build solution
        run: dotnet build MissionControl.slnx --configuration "$BUILD_CONFIGURATION"

      - name: Test backend
        run: dotnet test MissionControl.slnx --configuration "$BUILD_CONFIGURATION" --settings backend.tests/test.runsettings
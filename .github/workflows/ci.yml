name: Mission Control CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify lockfiles
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json

      - name: Check Docker
        run: docker version

      - name: Restore dependencies
        run: dotnet restore MissionControl.slnx --locked-mode

      - name: Build solution
        run: dotnet build MissionControl.slnx --configuration "$BUILD_CONFIGURATION"

      - name: Test backend
        run: dotnet test MissionControl.slnx --configuration "$BUILD_CONFIGURATION" --settings backend.tests/test.runsettings

      - name: Zachowaj raporty backendu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend.trx
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Zachowaj raporty UI
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
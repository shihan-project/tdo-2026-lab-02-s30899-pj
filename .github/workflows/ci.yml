name: Mission Control CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  LAB_LABEL: ${{ vars.LAB_LABEL }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pokaż etykietę projektu
        run: |
          echo "Uruchamiam CI dla projektu: $LAB_LABEL"

      - name: Sprawdź obecność sekretu ćwiczeniowego
        env:
          LAB_DEMO_TOKEN: ${{ secrets.LAB_DEMO_TOKEN }}
        run: |
          if [ -n "$LAB_DEMO_TOKEN" ]; then
            printf 'Sekret cwiczeniowy skonfigurowany\n'
          else
            printf 'Brak sekretu; testy nie wymagaja go do pracy\n'
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify lockfiles
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json

      - name: Cache NuGet
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ci-nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-${{ hashFiles('backend/packages.lock.json', 'backend.tests/packages.lock.json') }}
          restore-keys: |
            ci-nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-

      - name: Sprawdź wynik cache NuGet
        run: |
          if [ "${{ steps.nuget-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Dokładne trafienie cache NuGet"
          else
            echo "Brak dokładnego trafienia cache NuGet; sprawdź log przywracania"
          fi

      - name: Check Docker
        run: docker version

      - name: Restore dependencies
        run: dotnet restore MissionControl.slnx --locked-mode

      - name: Build solution
        run: dotnet build MissionControl.slnx --configuration "$BUILD_CONFIGURATION"

      - name: Test backend
        run: dotnet test MissionControl.slnx --configuration "$BUILD_CONFIGURATION" --settings backend.tests/test.runsettings

      - name: Zachowaj raporty backendu
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend.trx
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify frontend files
        run: |
          test -f ../.nvmrc
          test -f package-lock.json

      - name: Cache npm
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ci-npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ci-npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-

      - name: Sprawdź wynik cache npm
        run: |
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Dokładne trafienie cache npm"
          else
            echo "Brak dokładnego trafienia cache npm; sprawdź log przywracania"
          fi

      - name: Install dependencies
        run: time npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Zachowaj raporty UI
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn